name: Keep schedule active

# GitHub turns off scheduled workflows in a public repo after 60 days with no activity in it, and the
# scheduled run only ever writes to the private repo. One tiny commit a month here keeps it alive.
# It never touches the private repo or any secret.

on:
  schedule:
    - cron: "7 7 1 * *"      # 1st of each month
  workflow_dispatch:

permissions:
  contents: write            # only this job, only this repo, only the .keepalive file

jobs:
  keepalive:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4, pinned
      - name: Touch .keepalive
        run: |
          date -u +%Y-%m > .keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git diff --cached --quiet || git commit -q -m "Keep schedule active"
          git push -q
          echo "keepalive: ok"
